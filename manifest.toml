#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "numeria"
name = "Numeria"
description.en = "Math adventure RPG for kids: defeat monsters by solving math problems"
description.fr = "RPG d'aventure mathématique pour enfants : battez des monstres en résolvant des calculs"

version = "1.0.0~ynh1"

maintainers = []

[upstream]
license = "MIT"
code = "https://github.com/gzplaz/prodigy_ynh"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "50M"
ram.build = "50M"
ram.runtime = "60M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/numeria"

    [install.init_main_permission]
    help.en = "Who can play the game? Choose 'visitors' to let children without a YunoHost account play (they create a game account inside Numeria)."
    help.fr = "Qui peut jouer ? Choisissez 'visitors' pour que les enfants sans compte YunoHost puissent jouer (ils créent un compte de jeu dans Numeria)."
    type = "group"
    default = "visitors"

    [install.init_teacher_permission]
    ask.en = "Who can access the teacher dashboard?"
    ask.fr = "Qui peut accéder au tableau de bord enseignant ?"
    help.en = "The teacher dashboard shows every player's progress and lets you set their math grade or reset their password."
    help.fr = "Le tableau de bord enseignant affiche la progression des joueurs et permet de régler leur niveau ou réinitialiser leur mot de passe."
    type = "group"
    default = "admins"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.ports]
    main.default = 8095

    [resources.permissions]
    main.url = "/"

    teacher.url = "/teacher"
    teacher.show_tile = false

    [resources.apt]
    packages = "python3"
