#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  proxy_pass http://127.0.0.1:__PORT__/;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Lets the app scope its session cookie to this install path
  proxy_set_header X-Numeria-Base __PATH__;
  # User name provided by the YunoHost SSO (used by the teacher dashboard)
  proxy_set_header X-Numeria-User $remote_user;

  client_max_body_size 1M;

  # Include SSOWAT user panel's shortcut tile.
  include conf.d/yunohost_panel.conf.inc;
}
